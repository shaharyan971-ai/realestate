<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>🌱 Seed Properties — RealEstate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a; color: #f0f0f0;
    font-family: 'Outfit', system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,215,0,0.15);
    border-radius: 20px; padding: 40px;
    max-width: 600px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
  h1 span { background: linear-gradient(90deg,#FFD700,#FFA500); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  p { color: #666; font-size: 0.9rem; margin-bottom: 28px; }
  #log {
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,215,0,0.08);
    border-radius: 12px; padding: 16px; min-height: 120px;
    font-family: 'Courier New', monospace; font-size: 13px;
    color: #aaa; white-space: pre-wrap; line-height: 1.6;
    margin-bottom: 24px; max-height: 300px; overflow-y: auto;
  }
  button {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #FFD700, #FFA500);
    border: none; border-radius: 12px;
    color: #000; font-size: 1rem; font-weight: 800;
    cursor: pointer; transition: all 0.2s;
    font-family: inherit;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,215,0,0.4); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .success { color: #22c55e; }
  .error { color: #ef4444; }
  .warn { color: #FFD700; }
  a.go { display:block; text-align:center; margin-top:16px; color:#FFD700; font-size:14px; text-decoration:none; font-weight:600; }
  a.go:hover { text-decoration:underline; }
</style>

<!-- PWA & App Meta Tags -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-512.png">

</head>
<body>
<div class="card">
  <h1>🌱 <span>Seed Sample Properties</span></h1>
  <p>This will insert 14 realistic sample properties into your Supabase database covering all filter types: Sale/Rent, Apartment/Villa/House/Plot/Commercial, 1–5 BHK, and all deal scores.</p>
  <div id="log">Ready to seed. Click the button below…</div>
  <button id="seedBtn" onclick="runSeed()">🚀 Insert 14 Sample Properties</button>
  <a class="go" href="home.html" id="goHome" style="display:none;">→ Go to Properties Page</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const log = document.getElementById('log');
function msg(text, cls = '') {
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = text;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}
function clear() { log.innerHTML = ''; }

const PROPS = [
  { title:'3 BHK Sea View Apartment', listing_type:'Sale', category:'Apartment', location:'Bandra West, Mumbai', price:12500000, bedrooms:3, bathrooms:2, area:1450, deal_score:'Fair Price', image:'https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=700', contact_name:'Rohan Mehta', contact_phone:'9876543210', is_verified:true, total_views:428, amenities:['Parking','Gym','Lift','Security','Sea View'] },
  { title:'Cozy 2 BHK Apartment', listing_type:'Rent', category:'Apartment', location:'Koregaon Park, Pune', price:35000, bedrooms:2, bathrooms:2, area:1100, deal_score:'Great Deal', image:'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=700', contact_name:'Pooja Desai', contact_phone:'9123456789', is_verified:true, total_views:312, amenities:['Parking','Gym','Lift','Furnished'] },
  { title:'Modern Studio Apartment', listing_type:'Rent', category:'Apartment', location:'Connaught Place, Delhi', price:28000, bedrooms:1, bathrooms:1, area:620, deal_score:'Fair Price', image:'https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=700', contact_name:'Arjun Kapoor', contact_phone:'9988776655', is_verified:false, total_views:195, amenities:['Lift','Security','Furnished'] },
  { title:'Budget 2 BHK Society Flat', listing_type:'Sale', category:'Apartment', location:'Salt Lake, Kolkata', price:4800000, bedrooms:2, bathrooms:2, area:1050, deal_score:'Great Deal', image:'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=700', contact_name:'Subhasis Ghosh', contact_phone:'9001234567', is_verified:true, total_views:276, amenities:['Lift','Parking','Security'] },
  { title:'Penthouse with Private Terrace', listing_type:'Sale', category:'Apartment', location:'Worli, Mumbai', price:45000000, bedrooms:4, bathrooms:4, area:5200, deal_score:'Overpriced', image:'https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=700', contact_name:'Nikhil Shah', contact_phone:'9871234560', is_verified:true, total_views:891, amenities:['Parking','Pool','Gym','Lift','Furnished','Security','Garden'] },
  { title:'Premium 2 BHK Near Metro', listing_type:'Rent', category:'Apartment', location:'Sector 62, Noida', price:22000, bedrooms:2, bathrooms:2, area:980, deal_score:'Fair Price', image:'https://images.unsplash.com/photo-1493809842364-78817add7ffb?w=700', contact_name:'Kavita Sharma', contact_phone:'9811223344', is_verified:false, total_views:143, amenities:['Parking','Lift','Power Backup'] },
  { title:'Fully Furnished 3 BHK', listing_type:'Rent', category:'Apartment', location:'DLF Phase 2, Gurgaon', price:55000, bedrooms:3, bathrooms:3, area:1800, deal_score:'Fair Price', image:'https://images.unsplash.com/photo-1484154218962-a197022b5858?w=700', contact_name:'Rahul Gupta', contact_phone:'9654321098', is_verified:true, total_views:522, amenities:['Parking','Gym','Pool','Lift','Furnished','Security'] },
  { title:'Luxurious 4 BHK Garden Villa', listing_type:'Sale', category:'Villa', location:'Whitefield, Bangalore', price:18000000, bedrooms:4, bathrooms:4, area:3200, deal_score:'Great Deal', image:'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=700', contact_name:'Suresh Nair', contact_phone:'9845678901', is_verified:true, total_views:674, amenities:['Parking','Pool','Garden','Security','Power Backup'] },
  { title:'Elegant 5 BHK Seafront Villa', listing_type:'Sale', category:'Villa', location:'Adyar, Chennai', price:25000000, bedrooms:5, bathrooms:5, area:4500, deal_score:'Fair Price', image:'https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=700', contact_name:'Meena Iyer', contact_phone:'9934567890', is_verified:true, total_views:389, amenities:['Parking','Pool','Gym','Garden','Security','Power Backup'] },
  { title:'Spacious 3 BHK Independent House', listing_type:'Sale', category:'House', location:'Jubilee Hills, Hyderabad', price:9500000, bedrooms:3, bathrooms:3, area:2200, deal_score:'Great Deal', image:'https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=700', contact_name:'Prakash Reddy', contact_phone:'9700112233', is_verified:true, total_views:461, amenities:['Parking','Garden','Security'] },
  { title:'4 BHK Colonial Bungalow', listing_type:'Rent', category:'House', location:'Boat Club Road, Pune', price:90000, bedrooms:4, bathrooms:3, area:3000, deal_score:'Overpriced', image:'https://images.unsplash.com/photo-1598228723793-52759bba239c?w=700', contact_name:'Aditya Joshi', contact_phone:'9099887766', is_verified:false, total_views:208, amenities:['Parking','Garden','Power Backup'] },
  { title:'Prime Residential Plot – Corner', listing_type:'Sale', category:'Plot', location:'Sarjapur Road, Bangalore', price:7500000, bedrooms:0, bathrooms:0, area:2400, deal_score:'Great Deal', image:'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=700', contact_name:'Vijay Kumar', contact_phone:'9561230987', is_verified:true, total_views:317, amenities:['Corner Plot','Road Facing','BMRDA Approved'] },
  { title:'Commercial Office Space', listing_type:'Rent', category:'Commercial', location:'MG Road, Bangalore', price:120000, bedrooms:0, bathrooms:2, area:2400, deal_score:'Fair Price', image:'https://images.unsplash.com/photo-1497366216548-37526070297c?w=700', contact_name:'Divya Menon', contact_phone:'9812345670', is_verified:true, total_views:543, amenities:['Parking','Lift','Power Backup','Security'] },
  { title:'Retail Showroom on High Street', listing_type:'Sale', category:'Commercial', location:'Linking Road, Mumbai', price:32000000, bedrooms:0, bathrooms:1, area:1800, deal_score:'Overpriced', image:'https://images.unsplash.com/photo-1421941027568-40ab08ee5592?w=700', contact_name:'Farhan Sheikh', contact_phone:'9723456789', is_verified:true, total_views:712, amenities:['Parking','AC','High Footfall','CCTV'] }
];

async function runSeed() {
  const btn = document.getElementById('seedBtn');
  btn.disabled = true;
  clear();

  // Init Supabase
  let client;
  try {
    client = supabase.createClient(SB_URL, SB_KEY);
    msg('✅ Supabase client initialized');
  } catch(e) {
    msg('❌ Failed to init Supabase: ' + e.message, 'error');
    btn.disabled = false;
    return;
  }

  // Step 1 — ensure tables exist via REST
  msg('\n📋 Step 1: Checking if properties table exists…', 'warn');
  const { data: probe, error: probeErr } = await client.from('properties').select('id').limit(1);
  
  if (probeErr && probeErr.code === '42P01') {
    msg('⚠️  Table "properties" not found. Cannot auto-create via client key.', 'error');
    msg('   → Please run the SQL schema in your Supabase dashboard first.', 'error');
    msg('   → Go to: https://supabase.com/dashboard/project/ynsefltcqtffcdmxwpbn/editor', 'warn');
    btn.disabled = false;
    return;
  } else if (probeErr) {
    msg('⚠️  Table check warning: ' + probeErr.message, 'warn');
    msg('   (This may be an RLS policy issue — will try inserting anyway…)');
  } else {
    msg(`   Table exists. Current row count approx: ${probe ? probe.length : 0} visible rows`);
  }

  // Step 2 — check for existing seeds to avoid duplicates
  msg('\n🔍 Step 2: Checking for existing properties…', 'warn');
  const { data: existing } = await client.from('properties').select('title');
  const existingTitles = new Set((existing || []).map(p => p.title));
  const toInsert = PROPS.filter(p => !existingTitles.has(p.title));

  if (toInsert.length === 0) {
    msg('\n✅ All 14 sample properties already exist! No duplicates inserted.', 'success');
    msg('   → Open home.html to browse all properties!');
    document.getElementById('goHome').style.display = 'block';
    btn.disabled = false;
    return;
  }

  msg(`   ${existingTitles.size} already exist. Will insert ${toInsert.length} new properties.`);

  // Step 3 — Insert
  msg('\n🚀 Step 3: Inserting sample properties…', 'warn');
  let inserted = 0, failed = 0;

  for (const prop of toInsert) {
    const { error } = await client.from('properties').insert(prop);
    if (error) {
      msg(`   ❌ Failed: "${prop.title}" — ${error.message}`, 'error');
      failed++;
    } else {
      msg(`   ✅ Inserted: ${prop.title}`);
      inserted++;
    }
  }

  msg(`\n${'─'.repeat(50)}`);
  if (inserted > 0) {
    msg(`\n🎉 Done! ${inserted} properties inserted successfully!`, 'success');
    msg('\n   Open home.html to see all listings with fully working filters.');
    document.getElementById('goHome').style.display = 'block';
  }
  if (failed > 0) {
    msg(`\n⚠️  ${failed} properties failed to insert.`, 'error');
    msg('   This is usually an RLS policy issue in Supabase.', 'warn');
    msg('   Fix: Supabase Dashboard → Table Editor → properties → RLS Policies', 'warn');
    msg('   → Add a policy: allow INSERT for all users (or disable RLS temporarily)', 'warn');
  }

  btn.disabled = false;
}
</script>
</body>
</html>
