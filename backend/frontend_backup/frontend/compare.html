<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Comparison - RealEstate</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .compare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            align-items: start;
        }
        .compare-col {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: fadeUp 0.4s ease;
        }
        .compare-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }
        .compare-info {
            padding: 20px;
        }
        .compare-row {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }
        .compare-row:last-child { border-bottom: none; }
        .compare-label { color: var(--text-3); font-weight: 500; font-size: 0.8rem; text-transform: uppercase; }
        .compare-value { font-weight: 700; color: var(--text); }
        .compare-value.highlight { color: var(--gold); }
        
        .empty-col {
            border: 2px dashed var(--border);
            background: transparent;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-3);
            cursor: pointer;
            transition: var(--t);
        }
        .empty-col:hover {
            border-color: var(--gold-border);
            color: var(--gold);
            background: var(--gold-soft);
        }
        
        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg2);
            z-index: 2;
        }
        .modal-body { padding: 10px; }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-3);
        }
        
        .search-item {
            display: flex;
            gap: 12px;
            padding: 10px;
            border-radius: var(--r);
            cursor: pointer;
            transition: var(--t);
            border-bottom: 1px solid var(--border);
        }
        .search-item:hover { background: var(--card); }
        .search-item img { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; }
        .remove-btn {
            background: var(--error);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 12px;
            cursor: pointer;
            position: absolute;
            top: 10px;
            right: 10px;
        }
        
        .verdict-box {
            background: var(--gold-soft);
            border: 1px solid var(--gold-border);
            border-radius: var(--r);
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
    </style>

<!-- PWA & App Meta Tags -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-512.png">

</head>
<body>

<div class="sidebar" id="sidebar">
    <a href="home.html" class="sidebar-brand"> RealEstate</a>
    <a href="index.html"><span class="nav-icon"></span> Dashboard<span class="nav-arrow"></span></a>
    <a href="profile.html"><span class="nav-icon"></span> My Profile<span class="nav-arrow"></span></a>
    <a href="properties.html"><span class="nav-icon"></span> My Properties<span class="nav-arrow"></span></a>
    <a href="add-property.html"><span class="nav-icon"></span> Add Property<span class="nav-arrow"></span></a>
    <a href="messages.html"><span class="nav-icon"></span> Messages<span class="nav-arrow"></span></a>
    <a href="favorites.html"><span class="nav-icon"></span> Favorites<span class="nav-arrow"></span></a>
    <div class="sidebar-divider"></div>
    <a href="calculators.html"><span class="nav-icon"></span> Calculators<span class="nav-arrow"></span></a>
    <a href="compare.html" class="active-link"><span class="nav-icon"></span> Compare<span class="nav-arrow"></span></a>
    <a href="home.html"><span class="nav-icon"></span> Browse Properties<span class="nav-arrow"></span></a>
    <a href="#" id="logoutBtn" class="sidebar-logout" style="display:none;"><span class="nav-icon"></span> Logout<span class="nav-arrow"></span></a>
</div>
<div class="overlay" id="overlay"></div>

<div class="main">
    <div class="page-header">
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        <div style="flex:1;">
            <h1>Property Comparison</h1>
            <p>Compare your favorite picks side by side</p>
        </div>
        <button id="themeToggle" class="btn btn-outline btn-sm">
            <span id="themeIcon"></span>
        </button>
    </div>

    <div class="compare-grid" id="compareGrid">
        <!-- JS will populate these -->
        <div class="compare-col empty-col" onclick="openModal(0)">
            <span style="font-size:3rem"></span>
            <p style="margin-top:10px">Click to add property</p>
        </div>
        <div class="compare-col empty-col" onclick="openModal(1)">
            <span style="font-size:3rem"></span>
            <p style="margin-top:10px">Click to add property</p>
        </div>
        <div class="compare-col empty-col" onclick="openModal(2)">
            <span style="font-size:3rem"></span>
            <p style="margin-top:10px">Click to add property</p>
        </div>
    </div>

    <div id="verdict" class="verdict-box">
        <h3 style="color:var(--gold); margin-bottom:8px"> AI Comparison Verdict</h3>
        <p id="verdictText" style="color:var(--text); font-size:0.95rem"></p>
    </div>
</div>

<!-- Selection Modal -->
<div class="modal" id="searchModal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-header">
            <h3>Select Property</h3>
            <div class="form-group" style="margin-top:15px; margin-bottom:0">
                <input type="text" id="modalSearch" placeholder="Search by title or city..." oninput="filterModal()">
            </div>
        </div>
        <div class="modal-body" id="modalList">
            <!-- Properties listed here -->
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="script.js?v=8"></script>
<script>
    let currentUser = null;
    let allProperties = [];
    let comparedItems = [null, null, null];
    let activeSlot = 0;

    async function init() {
        currentUser = await Auth.getUser();
        if (!currentUser) {
            window.location.href = 'login.html';
            return;
        }

        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.style.display = 'block';
            logoutBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                await Auth.signOut();
                window.location.href = 'login.html';
            });
        }

        allProperties = await Store.getProperties();
        
        // Handle initial property from URL if any
        const urlParams = new URLSearchParams(window.location.search);
        const initialId = urlParams.get('id');
        if (initialId) {
            const p = await Store.getPropertyById(initialId);
            if (p) comparedItems[0] = p;
        }
        
        renderComparison();
    }

    // Theme Toggle Logic
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const html = document.documentElement;
    
    const savedTheme = localStorage.getItem('re_theme') || 'dark';
    html.setAttribute('data-theme', savedTheme);
    if(themeIcon) themeIcon.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

    themeToggle.addEventListener('click', () => {
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        themeIcon.textContent = newTheme === 'dark' ? '🌙' : '☀️';
        localStorage.setItem('re_theme', newTheme);
    });

    // Sidebar Logic
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    if(hamburger) {
        hamburger.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            hamburger.classList.toggle('open');
        });
    }

    if(overlay) {
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            hamburger.classList.remove('open');
        });
    }

    function openModal(slot) {
        activeSlot = slot;
        document.getElementById('searchModal').classList.add('active');
        renderModalList();
    }

    function closeModal() {
        document.getElementById('searchModal').classList.remove('active');
    }

    function renderModalList() {
        const container = document.getElementById('modalList');
        const q = document.getElementById('modalSearch').value.toLowerCase();
        
        container.innerHTML = '';
        const filtered = allProperties.filter(p => 
            p.title.toLowerCase().includes(q) || 
            (p.city && p.city.toLowerCase().includes(q))
        );

        if(filtered.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding:20px; color:var(--text-3)">No properties found</p>';
            return;
        }

        filtered.forEach(p => {
            const item = document.createElement('div');
            item.className = 'search-item';
            item.innerHTML = `
                <img src="${p.image || 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400'}" alt="">
                <div>
                    <div style="font-weight:700; font-size:0.9rem">${p.title}</div>
                    <div style="font-size:0.75rem; color:var(--text-3)">${p.city || ''}  Rs. ${formatPriceUI(p.price)}</div>
                </div>
            `;
            item.onclick = () => selectProperty(p);
            container.appendChild(item);
        });
    }

    function filterModal() {
        renderModalList();
    }

    function selectProperty(p) {
        comparedItems[activeSlot] = p;
        closeModal();
        renderComparison();
    }

    function removeProperty(index) {
        comparedItems[index] = null;
        renderComparison();
    }

    function formatPriceUI(price) {
        const n = parseFloat(price);
        if (n >= 10000000) return (n/10000000).toFixed(2) + ' Cr';
        if (n >= 100000) return (n/100000).toFixed(2) + ' L';
        return n.toLocaleString('en-IN');
    }

    function renderComparison() {
        const grid = document.getElementById('compareGrid');
        grid.innerHTML = '';
        
        comparedItems.forEach((p, index) => {
            if(!p) {
                const empty = document.createElement('div');
                empty.className = 'compare-col empty-col';
                empty.onclick = () => openModal(index);
                empty.innerHTML = `
                    <span style="font-size:3rem">＋</span>
                    <p style="margin-top:10px">Click to add property</p>
                `;
                grid.appendChild(empty);
            } else {
                const col = document.createElement('div');
                col.className = 'compare-col';
                col.style.position = 'relative';
                col.innerHTML = `
                    <button class="remove-btn" onclick="removeProperty(${index})">×</button>
                    <img class="compare-img" src="${p.image || 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400'}" alt="">
                    <div class="compare-info">
                        <h3 style="font-size:1rem">${p.title}</h3>
                        <p style="font-size:0.8rem; color:var(--text-3)">${p.location || p.city || ''}</p>
                    </div>
                    <div class="compare-row">
                        <span class="compare-label">Price</span>
                        <span class="compare-value highlight">Rs. ${formatPriceUI(p.price)}</span>
                    </div>
                    <div class="compare-row">
                        <span class="compare-label">Area</span>
                        <span class="compare-value">${p.area || 'N/A'} sqft</span>
                    </div>
                    <div class="compare-row">
                        <span class="compare-label">Beds</span>
                        <span class="compare-value">${p.bedrooms || '0'} BHK</span>
                    </div>
                    <div class="compare-row">
                        <span class="compare-label">Type</span>
                        <span class="compare-value">${p.category || 'Home'}</span>
                    </div>
                `;
                grid.appendChild(col);
            }
        });

        updateVerdict();
    }

    function updateVerdict() {
        const validItems = comparedItems.filter(p => p !== null);
        const verdictBox = document.getElementById('verdict');
        const verdictText = document.getElementById('verdictText');

        if(validItems.length < 2) {
            verdictBox.style.display = 'none';
            return;
        }

        verdictBox.style.display = 'block';
        
        let best = validItems[0];
        validItems.forEach(p => {
            const pRate = p.price / (p.area || 1000);
            const bRate = best.price / (best.area || 1000);
            if (pRate < bRate) best = p;
        });

        verdictText.textContent = `Based on current market analysis, the "${best.title}" appears to be the strongest choice, offering the better value for money at Rs. ${Math.round(best.price / (best.area || 1000)).toLocaleString('en-IN')} per sqft.`;
    }

    init();

</script>
</body>
</html>
