<script src="script.js?v=8"></script>
<script>
async function init() {
  const logged = await Auth.isLoggedIn();
  if (!logged) {
    window.location.href = 'login.html';
    return;
  }
  await loadFavorites();
}

async function loadFavorites() {
  const grid = document.getElementById('favoritesGrid');
  if (!grid) return;
  grid.innerHTML = '<div class="spinner-overlay show"><div class="spinner"></div></div>';

  const favs = await Store.getFavorites();

  grid.innerHTML = '';
  if (favs.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <span class="empty-icon"></span>
        <h3>No favorites yet</h3>
        <p>Go to property listings and click the heart icon to save them</p>
        <a href="home.html" class="btn btn-gold">Browse Properties</a>
      </div>`;
    return;
  }

  favs.forEach((prop, i) => {
    const card = renderPropertyCard(prop, { index: i, isFavorite: true });
    grid.appendChild(card);
  });
}

// Override handleFav from script.js to refresh grid on this page
const originalHandleFav = handleFav;
window.handleFav = async function(propId, btn) {
  await originalHandleFav(propId, btn);
  await loadFavorites();
};

loadFavorites();
</script>
