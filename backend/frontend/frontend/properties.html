<div class="overlay" id="overlay"></div>

<div class="main">
  <div class="page-header">
    <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
    <div>
      <h1 id="welcomeMsg">Welcome </h1>
      <p>Your listed properties</p>
    </div>
    <a href="add-property.html" class="btn btn-gold btn-sm" style="margin-left:auto;">+ Add New</a>
    <button onclick="exportPropertiesCSV()" class="btn btn-outline btn-sm" style="margin-left: 10px;">📥 Export CSV</button>
  </div>

  <h2 class="section-title"> My Properties</h2>

  <div class="cards-grid" id="myPropertiesGrid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="utils.js"></script>
<script src="script.js?v=8"></script>
<script>
async function init() {
  const logged = await Auth.isLoggedIn();
  if (!logged) {
    window.location.href = 'login.html';
    return;
  }
  await loadMyProperties();
}

async function loadMyProperties() {
  const grid = document.getElementById('myPropertiesGrid');
  if (!grid) return;
  grid.innerHTML = '<div class="spinner-overlay show"><div class="spinner"></div></div>';

  const props = await Store.getUserProperties();

  grid.innerHTML = '';
  if (props.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <span class="empty-icon"></span>
        <h3>No properties yet</h3>
        <p>List your first property and reach thousands of buyers</p>
        <a href="add-property.html" class="btn btn-gold">+ Add Property</a>
      </div>`;
    return;
  }

  props.forEach((prop, i) => {
    const card = renderPropertyCard(prop, { index: i, showEdit: true, showDelete: true, showFav: false });
    grid.appendChild(card);
  });
}

init();

</script>
</body>
</html>
