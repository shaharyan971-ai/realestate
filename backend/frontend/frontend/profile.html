<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
async function checkAuth() {
  const logged = await Auth.isLoggedIn();
  if (!logged) {
    window.location.href = 'login.html';
  } else {
    await loadProfile();
  }
}

async function loadProfile() {
  const user = await Auth.getUser();
  if (!user) return;

  // Set display info
  document.getElementById('displayName').textContent = user.full_name || 'User';
  document.getElementById('displayEmail').textContent = user.email || '';
  document.getElementById('displayJoined').textContent = 'Joined: ' + (user.created_at ? new Date(user.created_at).toLocaleDateString() : 'Today');

  // Set profile pic
  if (user.photo_url) {
    document.getElementById('profilePicDisplay').src = user.photo_url;
  } else {
    const initials = (user.full_name || 'U').split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
    document.getElementById('profilePicDisplay').src = `https://ui-avatars.com/api/?background=FFD700&color=000&size=110&bold=true&name=${encodeURIComponent(initials)}`;
  }

  // Fill form
  document.getElementById('profNameInput').value = user.full_name || '';
  document.getElementById('profEmailInput').value = user.email || '';
  document.getElementById('profPhoneInput').value = user.phone || '';
  document.getElementById('profCityInput').value = user.city || '';
  document.getElementById('profAddressInput').value = user.address || '';
  document.getElementById('profBioInput').value = user.bio || '';
}

// Photo upload
document.getElementById('imageUploadInput').addEventListener('change', async function () {
  const file = this.files[0];
  if (!file) return;

  const allowed = ['image/jpeg', 'image/png', 'image/webp'];
  if (!allowed.includes(file.type)) {
    showToast('Only JPG, PNG or WebP images are allowed', 'error');
    return;
  }

  if (file.size > 3 * 1024 * 1024) {
    showToast('Image must be smaller than 3MB', 'error');
    return;
  }

  showSpinner();

  const reader = new FileReader();
  reader.onload = function (e) {
    // Compress image
    const img = new Image();
    img.onload = async function () {
      const canvas = document.createElement('canvas');
      const maxSize = 400;
      let { width, height } = img;

      if (width > height && width > maxSize) {
        height = (height * maxSize) / width;
        width = maxSize;
      } else if (height > maxSize) {
        width = (width * maxSize) / height;
        height = maxSize;
      }

      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);

      const compressed = canvas.toDataURL('image/jpeg', 0.75);
      document.getElementById('profilePicDisplay').src = compressed;

      // Save to Supabase
      const updated = await Store.updateProfile({ photo_url: compressed });

      hideSpinner();
      if (updated) showToast('Photo upload ho gayi! ', 'success');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
});

// Profile form submit
document.getElementById('profileForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = sanitize(document.getElementById('profNameInput').value.trim());
  const phone = document.getElementById('profPhoneInput').value.trim();
  let valid = true;

  if (name.length < 2) {
    showError(document.getElementById('profNameInput'), 'Name must be at least 2 characters');
    valid = false;
  } else clearError(document.getElementById('profNameInput'));

  if (phone && !validatePhone(phone)) {
    showError(document.getElementById('profPhoneInput'), 'Please enter a valid 10-digit mobile number');
    valid = false;
  } else clearError(document.getElementById('profPhoneInput'));

  if (!valid) return;

  const btn = document.getElementById('saveProfileBtn');
  btn.textContent = ' Saving...';
  btn.disabled = true;

  const updated = await Store.updateProfile({
    full_name: name,
    phone: phone,
    city: sanitize(document.getElementById('profCityInput').value.trim()),
    address: sanitize(document.getElementById('profAddressInput').value.trim()),
    bio: sanitize(document.getElementById('profBioInput').value.trim())
  });

  if (updated) {
    document.getElementById('displayName').textContent = name;
    document.getElementById('welcomeMsg') && (document.getElementById('welcomeMsg').textContent = `Welcome, ${name} `);

    // Button animation
    btn.textContent = ' Saved!';
    setTimeout(() => { btn.textContent = ' Save Profile'; btn.disabled = false; }, 2000);

    showToast('Profile save ho gayi! ', 'success');
  } else {
    btn.textContent = ' Save Profile';
    btn.disabled = false;
  }
});

// Change Password - Supabase Auth method
document.getElementById('passwordForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const newPass    = document.getElementById('newPass').value;
  const confirmPass = document.getElementById('confirmPass').value;

  const passErr = validatePassword(newPass);
  if (passErr) {
    showError(document.getElementById('newPass'), passErr);
    return;
  }

  if (newPass !== confirmPass) {
    showError(document.getElementById('confirmPass'), 'Passwords do not match');
    return;
  }

  const btn = e.target.querySelector('button[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Updating...'; }

  try {
    let updatedOnline = false;
    if (typeof sb !== 'undefined' && sb) {
      try {
        const { error } = await sb.auth.updateUser({ password: newPass });
        if (error) throw error;
        updatedOnline = true;
      } catch (err) {
        if (!isNetworkError(err)) {
          throw err;
        }
      }
    }

    // Also update offline profile in localStorage if available
    try {
      const user = Auth.currentUser || await Auth.getUser();
      if (user && user.email) {
        let users = [];
        try { users = JSON.parse(localStorage.getItem('re_users') || '[]'); } catch(e) { users = []; }
        const userIndex = users.findIndex(u => u.email === user.email);
        if (userIndex !== -1) {
          const hashed = await hashPassword(newPass);
          users[userIndex].passwordHash = hashed;
          localStorage.setItem('re_users', JSON.stringify(users));
          // If offline mode is active, update mock session as well
          const offSess = localStorage.getItem('sb_offline_session');
          if (offSess) {
            const sess = JSON.parse(offSess);
            if (sess && sess.user && sess.user.email === user.email) {
              sess.user.passwordHash = hashed;
              localStorage.setItem('sb_offline_session', JSON.stringify(sess));
            }
          }
        }
      }
    } catch(e) {
      console.warn("Failed to update offline password backup:", e);
    }

    document.getElementById('passwordForm').reset();
    showToast('Password changed successfully! 🎉', 'success');
  } catch(err) {
    console.error('Password Update Error:', err);
    showError(document.getElementById('newPass'), err.message || 'Could not update password');
    showToast('Could not update password', 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Update Password'; }
  }
});

checkAuth();


// Clipboard protection on confirm password field
ClipboardGuard.protect('confirmPass');

  secBtn.innerHTML = ' Security Center';
  secBtn.addEventListener('mouseenter', function() { this.style.background = 'linear-gradient(135deg,#2a1f00,#3a2d00)'; });
  secBtn.addEventListener('mouseleave', function() { this.style.background = 'linear-gradient(135deg,#1a1200,#2a1f00)'; });
  document.body.appendChild(secBtn);
})();
</script>
